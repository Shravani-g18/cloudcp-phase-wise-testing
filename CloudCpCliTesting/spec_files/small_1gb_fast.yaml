version: 1
mode: tree
root: /bryck/small_1gb
threads: 4
seed: 42

# This filename is only a sentinel now: ensure_dataset() in
# negative_environment_runner.py detects the literal string
# "small_1gb_fast.yaml" and swaps in a round-robin pick from
# DATASET_SPEC_ROTATION (09_unicode_names.yaml / 06_sparse_files.yaml /
# 11_mixed_realistic.yaml -- real CloudCpFallbackTesting specs) instead of
# ever actually reading this file's content. Kept only as a harmless fallback
# in case that rotation constant is ever removed.
content:
  type: random
  buffer_size: 64KB

naming:
  charset: mixed
  alphabet: [lower, upper, digit]
  prefix: "obj-"
  length: 10
  collision_strategy: append-index

tree:
  fanout: 3
  depth: 2
  files_per_dir: 5
  files_in_each_dir: false

size:
  type: range
  min: 1KB
  max: 256KB
  distribution: log-uniform

extensions:
  - ext: .txt
    weight: 40
  - ext: .json
    weight: 25
  - ext: .csv
    weight: 20
  - ext: .bin
    weight: 15
