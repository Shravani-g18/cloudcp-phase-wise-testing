version: 1
mode: tree
root: /bryck/cloudcp_fallback/tiny_files
threads: 8
seed: 42

# TINY tier: 1 B .. < 1 MiB. High file count -> throughput / many single-part PUTs.
# fanout 6 x depth 3 = 216 leaf dirs x 25 files = 5,400 files.
content:
  type: random
  buffer_size: 8MB

naming:
  charset: ascii
  alphabet: [lower, upper, digit]
  prefix: "tiny-"
  length: 12
  collision_strategy: append-index

tree:
  fanout: 6
  depth: 3
  files_per_dir: 25
  files_in_each_dir: false

size:
  type: range
  min: 1KB
  max: 256KB
  distribution: log-uniform

extensions:
  - ext: .txt
    weight: 50
  - ext: .json
    weight: 30
  - ext: .log
    weight: 20
