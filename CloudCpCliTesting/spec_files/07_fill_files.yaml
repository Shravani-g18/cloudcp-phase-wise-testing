version: 1
mode: flat
root: /bryck/cloudcp_fallback/fill_files
threads: 4
seed: 42

# Deterministic content (every byte = 0x00). Same seed + fill => reproducible
# bytes => stable, verifiable checksums after upload.
content:
  type: fill
  fill_byte: 0x00
  buffer_size: 16MB
  fsync: true

naming:
  charset: ascii
  alphabet: [lower, digit]
  prefix: "fill-"
  length: 10

flat:
  num_files: 80

size:
  type: fixed
  bytes: 4MB

extensions:
  - ext: .bin
    weight: 1
