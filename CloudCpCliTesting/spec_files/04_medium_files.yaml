version: 1
mode: flat
root: /bryck/cloudcp_fallback/medium_files
threads: 4
seed: 42

# MEDIUM tier: 64 MiB .. < 1024 MiB. Multi-chunk multipart (8 MiB chunks).
# Random content so multipart part checksums are meaningful.
content:
  type: random
  buffer_size: 16MB
  direct_io:
    enabled: true
    min_size: 256MB

naming:
  charset: ascii
  alphabet: [lower, digit]
  prefix: "medium-"
  length: 12

flat:
  num_files: 12

size:
  type: range
  min: 64MB
  max: 512MB
  distribution: uniform

extensions:
  - ext: .bin
    weight: 1
