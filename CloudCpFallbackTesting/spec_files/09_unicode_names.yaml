version: 1
mode: flat
root: /bryck/cloudcp_fallback/unicode_names
threads: 4
seed: 42

# Unicode / emoji / CJK / Cyrillic + spaces in filenames. Mirrors the real
# sample batch (accented, Cyrillic, CJK, spaces) and validates byte-exact
# path round-trip through the NUL-framed batch and into object keys.
content:
  type: random
  buffer_size: 4MB

naming:
  charset: mixed
  alphabet: [lower, upper, digit]
  unicode_blocks:
    - latin-supplement
    - cyrillic
    - cjk-unified
    - emoji
  special_chars: " ()[]&_-"
  length: 16

flat:
  num_files: 150

size:
  type: range
  min: 1KB
  max: 512KB
  distribution: uniform

extensions:
  - ext: .txt
    weight: 60
  - ext: .yaml
    weight: 20
  - ext: .log
    weight: 20
