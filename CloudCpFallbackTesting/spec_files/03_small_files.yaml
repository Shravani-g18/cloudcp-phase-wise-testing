version: 1
mode: flat
root: /bryck/cloudcp_fallback/small_files
threads: 8
seed: 42

# SMALL tier: 1 MiB .. < 64 MiB. Straddles the 8 MiB upload_cutoff, so some
# files use single-part PUT and some cross into multipart.
content:
  type: random
  buffer_size: 8MB

naming:
  charset: ascii
  alphabet: [lower, digit]
  prefix: "small-"
  length: 12

flat:
  num_files: 120

size:
  type: range
  min: 1MB
  max: 16MB
  distribution: uniform

extensions:
  - ext: .bin
    weight: 60
  - ext: .dat
    weight: 40
